services:
  - type: web
    name: sonarvision-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn api.predict_api:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      # Suppress ultralytics telemetry/update checks that slow startup
      - key: YOLO_OFFLINE
        value: "1"
      - key: ULTRALYTICS_OFFLINE
        value: "1"
      # OpenCV headless mode — no display needed
      - key: MPLBACKEND
        value: Agg
